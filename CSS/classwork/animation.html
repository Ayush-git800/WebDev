<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
    
    div{
        width: 200px;
        height: 200px;
        position: relative;
        border-radius: 100px;
    }
        .div1 {
            
           background: #8a2be2; 
           background: -webkit-linear-gradient(to right, #f8f8ff, #ffa500, #8a2be2);
           background: linear-gradient(to right, #f8f8ff, #ffa500, #8a2be2);
            animation-name: example;
            animation-duration: 4s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            border-radius: 100px;
        }

         .div2 {
            
            background-color: rgb(15, 229, 140);
            animation-name: example1;
            animation-duration: 4s;
            /* animation-delay: 2s; */
            animation-iteration-count: infinite;
            border-radius: 100px;
        }

         .div3 {
        
            background-color: rgb(15, 229, 140);
            animation-name: example2;
            animation-duration: 4s;
            /* animation-delay: 2s; */
            animation-iteration-count: infinite;
            border-radius: 100px;
        }


       @keyframes example {
    0%   { background-image: none; background-color: rgb(21, 104, 229); left: 0px; top: 0px; }
    25%  { background-image: none; background-color: rgb(234, 15, 212); left: 400px; top: 200px; }
    50%  { background-image: none; background-color: rgb(225, 179, 12); left: 900px; top: 100px; }
    75%  { background-image: none; background-color: rgb(217, 10, 10); left: 0px; top: 500px; }
    100% { background-image: none; background-color: rgb(26, 4, 224); left: 300px; top: 0px; }
}

        @keyframes example1 {
            0%   {background-color: rgb(21, 104, 229); left:300px; top:0px;}
            25%  {background-color: rgb(234, 15, 212); left:0px; top:500px;}
            50%  {background-color: rgb(225, 179, 12); left:900px; top:100px;}
            75%  {background-color: rgb(217, 10, 10); left:400px; top:200px;}
            100% {background-color: rgb(26, 4, 224); left:0px; top:0px;}
        }

        @keyframes example2 {
            0%   {background-color: rgb(21, 104, 229); left:400px; top:0px;}
            25%  {background-color: rgb(234, 15, 212); left:250px; top:200px;}
            50%  {background-color: rgb(225, 179, 12); left:500px; top:400px;}
            75%  {background-color: rgb(217, 10, 10); left:600px; top:200px;}
            100% {background-color: rgb(26, 4, 224); left:200px; top:100px;}
        }
    </style>
</head>
<body>

    <h1>CSS Animations</h1>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    
</body>
</html>
