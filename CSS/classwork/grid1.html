<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Grid Boxes</title>
  <style>

  .container {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(2, 100px);
  grid-template-rows: repeat(2, 200px);
  justify-content: space-evenly;
  align-content: space-evenly;
  width: 600px;
  height: 600px;
  padding: 25px;
  border: 2px solid black;
  border-radius: 10px;
}

.box {
  box-sizing: border-box;
  width: 100px;
  height: 200px;
  border: 2px solid rgb(0, 0, 0);
  border-radius: 8px;
  background-color: rgb(38, 200, 159);

  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </div>
</body>
</html>
