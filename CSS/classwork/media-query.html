<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .container {
            padding: 20px;
            height: 400px;
            width: 400px;
            align-items: center;
            align-content: center;
        }

         @media (max-width: 600px) {
            .container {
                padding: 10px;
                background-color: rgb(216, 79, 33);
                border: 15px solid rgb(0, 0, 0);
            }
        }

        @media (min-width: 600px) {
            .container {
                padding: 10px;
                background-color: rgb(87, 63, 206);
                border: 2px solid rgb(0, 0, 0);
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 10px;
                background-color: rgb(27, 213, 173);
                border : 2px dashed rgb(0, 0, 0);
            }
        }

        @media (min-width: 992px) {
            .container {
                padding: 10px;
                background-color: rgb(13, 228, 13);
                border-radius: 28%;
            }
        }

        @media (min-width: 1200px) {
            .container {
                padding: 10px;
                background-color: rgb(214, 36, 173);
                border-radius: 5%;
            }
        }

        
    </style>
</head>
<body>
    <div class="container">
        <h1>Media Queries</h1>
        <p>This is a simple example of using media queries in CSS.</p>
    </div>
</body>
</html>
