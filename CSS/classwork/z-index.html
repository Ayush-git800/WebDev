<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNDkjZFuL0zEe1n7RzWk_yUDAx-KaRm3cABu3gEtYtGQ&s=10">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
