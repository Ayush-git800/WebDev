<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
<style>
    body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }


        .parent {
            width: 500px;
            height: 500px;
            background-color: #e8f4f8;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center; 
            align-items: flex-start;     
            gap: 30px;              
            justify-content: space-evenly;
        }
       
        .box {
            width: 50px;
            height: 50px;
            margin: 10px;   
            background-color: #31c798;
            border: 2px dashed #052c55;
            border-radius: 6px;

            display: flex;
            justify-content: center;
            align-items: center;
        }
</style>
</head>
<body>
     <div class="parent">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
        <div class="box">E</div>
        <div class="box">F</div>
    </div>
</body>
</html>
