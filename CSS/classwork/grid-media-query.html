<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Media Query</title>
    <style>
        
        * {
    box-sizing: border-box;
    }
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    }
        .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100vw;
    height: 100vh;
    padding: 20px;
   }
       .item {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    width: 100%;
    height: 100%;
   }
       .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
   }
        @media (max-width: 600px) {
    body {
        align-items: flex-start;
        padding: 20px 0;
    }
    .container {
        grid-template-columns: 1fr; 
        width: 300px;
        height: auto;
    }
}
        @media (min-width: 601px) and (max-width: 768px) {
            body {
        align-items: flex-start;
        padding: 20px 0;
    }
    .container {
        grid-template-columns: repeat(2, 1fr); 
        width: 300px;
        height: auto;
    }
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="item"><img src="img34.jpeg" alt="Image 1"></div>
        <div class="item"><img src="img54.jpeg" alt="Image 2"></div>
        <div class="item"><img src="Photo new.jpg" alt="Image 3"></div>
        <div class="item"><img src="pic55.png" alt="Image 4"></div>
        <div class="item"><img src="images.jpeg" alt="Image 5"></div>
        <div class="item"><img src="pic55.png" alt="Image 6"></div>
        <div class="item"><img src="Photo new.jpg" alt="Image 7"></div>
        <div class="item"><img src="img54.jpeg" alt="Image 8"></div>
        <div class="item"><img src="img34.jpeg" alt="Image 9"></div>
    </div>
</body>
</html>
