<!DOCTYPE html>
<html>
<head>
  <title>Layout</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: grey;
      color:black;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      align-items: center;
    }

    .title {
      font-size: 24px;
    }

    .links a{
      color: black;
      text-decoration: none;
      margin-left: 15px;
    }
    .box {
      background-color: rgb(255, 255, 255);
      padding: 10px;
      margin: 20px;
      border: 2px solid black;
      align-items: left;
      width: 300px;
      border-radius: 10px;
      text-align: center;

    }
  </style>
</head>
 <body>

  <div class="header">
    <span class="title">Ayush Chauhan</span>
    
    <span class="links">
      <a href="https://hub.msot.org/student/#/dashboard" target="_blank">MSOT</a>
      <a href="https://trackstack-msot.vercel.app/" target="_blank">Track Stack</a>
      <a href="https://github.com/Ayush-git800" target="_blank">Git Hub</a>
    </span>
  </div>

  <div class="box">
      <h2>Box</h2>
      <p>
        This is a box.
      </p>
    </div>
  </div>

 </body>
</html>
