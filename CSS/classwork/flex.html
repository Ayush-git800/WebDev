<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  background-color: rgb(89, 145, 201);
}

.container div {
  background-color: #f0eded;
  margin: 10px;
  padding: 20px;
  font-size: 24px;
}
</style>
</head>
<body>

<h1>Create a Flex Container</h1>

<div class="container">
  <div>HTML</div>
  <div>CSS</div>
  <div>Git</div>  
  <div>Git Hub</div>
</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>
</body>
</html>
