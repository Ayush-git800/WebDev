<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Sign Up</h1>
    <p>Please fill in this form to create an account.</p><hr>

    <form action="/action_page.php">
  <label for="email"><b>Email:</b></label>
  <input type="email" id="email" name="email" placeholder="Enter Your Email" required><br><br>
  <label for="pass"><b>Password:</b></label>
  <input type="password" id="pass" name="pass" placeholder="Enter Your Password" required><br><br>
  <label for="rpas"><b>Repeat Password:</b></label>
  <input type="password" id="rpas" name="rpas" placeholder="Repeat Password" required><br><br>
  <label for="dob"><b>DOB:</b></label>
  <input type="date" id="dob" name="dob"><br><br>
  <label for="number"><b>Phone Number:</b></label>
  <input type="tel" id="number" name="number" placeholder="Enter Phone Number"><br><br>
  <label for="gender"><b>Gender:</b></label><br>
  <input type="radio" id="male" name="gender" value="Male">
  <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label><br>
     <input type="radio" id="other" name="gender" value="Other">
    <label for="other">Other</label><br><br>

 <input type="checkbox" id="remeber" name="remeber" value="Remember">
<label for="remeber"><b>Remember Me</b></label><br><br>
  <p>By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
  <input type="submit" value="Cancel">
  <input type="submit" value="Sign Up"><hr>
    

</form> 
</body>
</html>
