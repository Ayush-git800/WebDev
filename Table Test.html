<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Test</title>
</head>
<body>
    <table border="5" cellpadding="9" cellspacing="7" width="80%" align="center" >
        <caption> <b>Quaterly Sales Report (INR)</b> </caption>
        <thead>
            <tr bgcolor="Grey">
                <th>Category</th>
                <th> Product</th>
                <th>Q1 Sales</th>
                <th>Q2 Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" valign="top" >Electronics</td>
                <td bgcolor="#F0F0F0">Smartphones</td>
                <td bgcolor="#F0F0F0" align="right">₹4,72,450</td>
                <td bgcolor="#F0F0F0" align="right">₹5,85,838</td>
            </tr>
            <tr bgcolor="#F0F0F0">
                <td>Laptops</td>
                <td align="right">₹8,03,165</td>
                <td align="right">₹8,59,859</td>
            </tr>
            </tbody>
<tfoot>
        
        <tr bgcolor="lightGrey">
            <td align="left" colspan="2"><strong>Total Gross</strong></td>
            <td align="right"><strong>₹12,75,615</strong></td>
            <td align="right"><strong>₹14,45,697</strong></td>
        </tr>
        
</tfoot>
</body>
</html>
